<div class="language-selector">
    <button class="current-lang" aria-haspopup="true" aria-expanded="false">
        <img src="/assets/images/flags/${currentLocale}.svg" alt="" 
             data-i18n-attr='{"alt": "languages.${currentLocale}"}'>
        <span data-i18n="languages.${currentLocale}"></span>
    </button>
    <div class="lang-dropdown" role="menu">
        <!-- 동적으로 생성되는 언어 목록 -->
    </div>
</div>
